services:
  income-api:
    build: .
    container_name: income-api
    restart: unless-stopped
    environment:
      PORT: 8788
      HOST: 0.0.0.0
      APP_ORIGIN: https://income.ccwu.cc
      API_ALLOWED_ORIGINS: https://income.ccwu.cc
      ADMIN_USERNAME: morefun886
      ADMIN_PASSWORD_HASH: pbkdf2-sha256$120000$71967f384b82039181934393be30d845$4f5fc3e39642986fa1016f6991b38a727c8dcb0b389a12f50cd43cae31bd7fcb
      JWT_SECRET: ""
      UPLOAD_MAX_MB: 10
      BACKUP_DIR: /app/storage/backups
      LOGIN_MAX_ATTEMPTS: 8
      LOGIN_LOCK_MINUTES: 15
    ports:
      - "8788:8788"
    volumes:
      - ./storage:/app/storage
    networks:
      - income-net

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: income-tunnel
    restart: unless-stopped
    command: tunnel run
    environment:
      TUNNEL_TOKEN: 粘贴你的Token到这里
    networks:
      - income-net

networks:
  income-net:
    driver: bridge
