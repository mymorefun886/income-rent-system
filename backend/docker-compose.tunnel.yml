# Cloudflare Tunnel - 内网穿透，无需开端口
# 部署前先执行: docker compose -f docker-compose.tunnel.yml run --rm cloudflared tunnel login
# 创建 tunnel: docker compose -f docker-compose.tunnel.yml run --rm cloudflared tunnel create income-api
# DNS 绑定: docker compose -f docker-compose.tunnel.yml run --rm cloudflared tunnel route dns income-api api.income.ccwu.cc

services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: income-tunnel
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}  # 从 Cloudflare Zero Trust 获取
    network_mode: host
