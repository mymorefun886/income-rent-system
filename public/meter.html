<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>抄表录入</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font:14px "Microsoft YaHei",sans-serif;background:#f0f4f8;color:#1e293b;padding:8px;max-width:480px;margin:0 auto}
.h{background:#2563eb;color:#fff;padding:12px 16px;border-radius:12px;margin-bottom:10px}
.h h1{font-size:18px}.h div{font-size:12px;opacity:.8;margin-top:2px}
.bld{background:#dbeafe;padding:8px 12px;border-radius:8px;font-weight:bold;font-size:13px;margin:8px 0 4px;display:flex;justify-content:space-between}
.row{background:#fff;border-radius:8px;padding:10px 12px;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.room{font-weight:bold;font-size:16px;min-width:36px}
.inp{flex:1;display:flex;flex-direction:column}
.inp label{font-size:10px;color:#64748b}
.inp input{width:100%;border:1px solid #cbd5e1;border-radius:6px;padding:8px 6px;font-size:15px;text-align:center}
.inp input:focus{outline:none;border-color:#2563eb;box-shadow:0 0 0 2px #bfdbfe}
.prev{font-size:10px;color:#94a3b8;text-align:right;min-width:28px}
.btns{position:sticky;bottom:8px;background:#fff;border-radius:12px;padding:12px;margin-top:12px;box-shadow:0 -2px 12px rgba(0,0,0,.08);display:flex;gap:8px}
.btns button{flex:1;padding:12px;border:none;border-radius:10px;font-size:15px;font-weight:bold;cursor:pointer}
.btn-save{background:#2563eb;color:#fff}
.btn-export{background:#10b981;color:#fff}
.btn-clear{background:#f1f5f9;color:#64748b}
.status{font-size:11px;color:#64748b;text-align:center;padding:4px}.status.ok{color:#16a34a}.status.err{color:#ef4444}
.toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;z-index:99;opacity:0;transition:opacity .3s}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="h"><h1>抄表录入</h1><div>打开即同步最新数据 · 离线可用 · 导出CSV</div></div>
<div id="statusBar" class="status">正在加载最新数据...</div>
<div id="app"></div>
<div class="btns">
  <button class="btn-clear" onclick="clearAll()">清空</button>
  <button class="btn-save" onclick="saveData()">暂存</button>
  <button class="btn-export" onclick="exportData()">导出 CSV</button>
</div>
<div class="toast" id="toast"></div>
<script>
var ROOMS = [];
var CYCLE = new Date().toISOString().slice(0,7);
var STORAGE_KEY = "meter_" + CYCLE;

function showToast(msg) {
  var t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  setTimeout(function(){ t.classList.remove("show"); }, 1500);
}

function loadData() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch(e) { return {}; }
}

function saveData() {
  var data = {};
  document.querySelectorAll(".row").forEach(function(r) {
    var rid = r.dataset.rid;
    var e = r.querySelector(".e").value;
    var w = r.querySelector(".w").value;
    if (e || w) data[rid] = [e, w];
  });
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  showToast("已暂存 " + Object.keys(data).length + " 条");
}

function exportData() {
  saveData();
  var data = loadData();
  var lines = ["building,room,electricNow,waterNow"];
  ROOMS.forEach(function(r) {
    var v = data[r.b + "::" + r.r] || ["", ""];
    if (v[0] || v[1]) lines.push(r.b + "," + r.r + "," + v[0] + "," + v[1]);
  });
  var csv = "﻿" + lines.join("\n");
  var blob = new Blob([csv], {type: "text/csv"});
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "meter_" + CYCLE + ".csv";
  a.click();
  showToast("已导出 " + (lines.length - 1) + " 条到 CSV");
}

function clearAll() {
  if (confirm("确定清空？")) {
    localStorage.removeItem(STORAGE_KEY);
    render();
    showToast("已清空");
  }
}

function render() {
  var data = loadData();
  var groups = {};
  ROOMS.forEach(function(r) {
    var b = r.b || "其他";
    if (!groups[b]) groups[b] = [];
    groups[b].push(r);
  });
  var h = "";
  Object.keys(groups).forEach(function(b) {
    var rs = groups[b];
    h += '<div class="bld">' + b + ' <span>' + rs.length + '间</span></div>';
    rs.forEach(function(r) {
      var v = data[r.b + "::" + r.r] || ["", ""];
      h += '<div class="row" data-rid="' + r.b + '::' + r.r + '">';
      h += '<div class="room">' + r.r + '</div>';
      h += '<div class="inp"><label>电(度)</label><input class="e" type="number" step="1" inputmode="numeric" value="' + v[0] + '"></div>';
      h += '<div class="prev">' + (r.ep ? "上" + r.ep : "") + '</div>';
      h += '<div class="inp"><label>水(方)</label><input class="w" type="number" step="0.1" inputmode="decimal" value="' + v[1] + '"></div>';
      h += '<div class="prev">' + (r.wp ? "上" + r.wp : "") + '</div>';
      h += '</div>';
    });
  });
  document.getElementById("app").innerHTML = h;
}

// 尝试从API获取最新数据
function getApiBase() {
  var h = window.location.hostname;
  if (h === "localhost" || h === "127.0.0.1") return "http://127.0.0.1:8788";
  return "https://api." + window.location.hostname;
}

async function fetchLatest() {
  try {
    var resp = await fetch(getApiBase() + "/api/meter-data");
    if (resp.ok) {
      ROOMS = await resp.json().then(function(d) { return d.data || []; });
      document.getElementById("statusBar").textContent = "已同步 " + ROOMS.length + " 间房 · 最新上期读数";
      document.getElementById("statusBar").className = "status ok";
      render();
      return;
    }
  } catch(e) {}
  // API不可用，尝试本地缓存
  var cached = localStorage.getItem("meter_rooms");
  if (cached) {
    try { ROOMS = JSON.parse(cached); } catch(e) {}
  }
  document.getElementById("statusBar").textContent = ROOMS.length ? "离线模式 · " + ROOMS.length + " 间房" : "无法加载数据，请检查网络";
  document.getElementById("statusBar").className = ROOMS.length ? "status" : "status err";
  render();
}

// 加载后缓存房间列表供离线用
function cacheRooms() {
  if (ROOMS.length) localStorage.setItem("meter_rooms", JSON.stringify(ROOMS));
}

// 启动
(async function() {
  await fetchLatest();
  cacheRooms();
})();
</script>
</body>
</html>
